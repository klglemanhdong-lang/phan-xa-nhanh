<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SIÊU TRÍ NHỚ</title>
<link rel="stylesheet" href="shared.css">
<style>
body { display:flex; align-items:center; justify-content:center; }
#app { justify-content:flex-start; overflow-y:auto; padding:32px 14px 36px; gap:0; scroll-behavior: smooth; }

/* Logo */
.logo-wrap { text-align:center; padding:20px 0 14px; flex-shrink:0; }
.logo-ring {
  width:76px; height:76px; border-radius:50%;
  border:3px solid var(--gold);
  display:flex; align-items:center; justify-content:center;
  margin:0 auto 8px; box-shadow:var(--glow-gold);
  animation:ringPulse 2.5s ease-in-out infinite;
}
@keyframes ringPulse {
  0%,100%{box-shadow:0 0 12px rgba(255,215,0,.5),0 0 25px rgba(255,215,0,.2);}
  50%{box-shadow:0 0 28px rgba(255,215,0,.9),0 0 55px rgba(255,215,0,.4);}
}
.logo-emoji { font-size:2.3rem; }
.main-title {
  font-family:var(--font-head); font-size:2.1rem; letter-spacing:4px;
  background:linear-gradient(135deg,#FFD700,#f39c12,#FFD700);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  filter:drop-shadow(0 0 8px rgba(255,215,0,.6));
}
.title-sub { font-size:.72rem; color:rgba(255,215,0,.5); letter-spacing:2px; margin-top:2px; }

/* Total progress */
.total-prog {
  width:100%; max-width:380px; margin:0 auto 18px;
  background:rgba(255,255,255,.04); border:1px solid var(--border);
  border-radius:12px; padding:10px 14px;
}
.tp-row { display:flex; justify-content:space-between; font-size:.76rem; color:rgba(255,255,255,.5); margin-bottom:6px; }
.tp-count { font-family:var(--font-head); font-size:1rem; color:var(--gold); }
.tp-track { height:8px; background:rgba(255,255,255,.07); border-radius:4px; overflow:hidden; }
.tp-fill { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold2)); border-radius:4px; transition:width .8s ease; box-shadow:0 0 6px var(--gold); }

/* ── CSS CHÓI SÁNG ĐẶC BIỆT CHO 2 Ô THI ĐẤU ── */
.tournament-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.tournament-btn {
  border-width: 2px !important;
  background: rgba(0,0,0,.4) !important;
  animation: tournamentSuperGlow 2s infinite alternate !important;
  opacity: 1 !important;
}
.tournament-btn .stars {
  font-size: 0.8rem;
  letter-spacing: 2px;
  margin-top: 2px;
  text-shadow: 0 0 6px currentColor;
}
/* Ô 3 Sao phát sáng màu Cam Vàng */
#btn-tour-3 {
  --t-color: #ff9f43;
  border-color: #ff9f43 !important;
}
#btn-tour-3 .stars { color: #ff9f43; }
/* Ô 5 Sao phát sáng rực rỡ màu Đỏ Hồng Trùm Cuối */
#btn-tour-5 {
  --t-color: #ff3838;
  border-color: #ff3838 !important;
}
#btn-tour-5 .stars { color: #ff3838; }

@keyframes tournamentSuperGlow {
  0% {
    box-shadow: 0 0 8px rgba(var(--t-color), 0.3), inset 0 0 4px rgba(var(--t-color), 0.2);
    filter: brightness(1);
  }
  100% {
    box-shadow: 0 0 25px var(--t-color), inset 0 0 12px var(--t-color);
    filter: brightness(1.3);
  }
}

/* Section */
.section { width:100%; max-width:380px; margin:0 auto 18px; }
.section-header {
  display:flex; align-items:center; gap:10px; margin-bottom:10px;
}
.section-tag {
  font-family:var(--font-head); font-size:.9rem; letter-spacing:2px;
  padding:5px 13px; border-radius:8px; border:1px solid;
  white-space:nowrap;
}
.section-line { flex:1; height:1px; opacity:.25; }

/* Level grid */
.level-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }

/* Level button */
.lv-btn {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:12px 6px; border-radius:13px; border:2px solid var(--c,#00d2ff);
  background:rgba(0,0,0,.35); cursor:pointer; text-decoration:none; color:white;
  transition:transform .15s; position:relative; overflow:hidden; gap:3px;
  backdrop-filter:blur(6px);
}
.lv-btn:active { transform:scale(.94); }

/* States */
.lv-btn.done { border-color:#2ecc71; }
.lv-btn.done::after {
  content:"✓"; position:absolute; top:5px; right:8px;
  font-size:12px; color:#2ecc71; font-weight:900;
}
.lv-btn.locked {
  border-color:rgba(255,255,255,.09) !important;
  background:rgba(0,0,0,.5) !important;
  cursor:not-allowed; opacity:.4;
}
.lv-btn.locked .lv-num { color:rgba(255,255,255,.2); }
.lv-btn.locked::after {
  content:"🔒"; position:absolute; top:5px; right:7px; font-size:11px;
}

/* ── HỘP KHUNG VÀNG PHÁT SÁNG CHO LEVEL HIỆN TẠI ── */
.lv-btn.current-playing {
  border-color: #FFD700 !important;
  border-width: 2px !important;
  background: rgba(255, 215, 0, 0.08) !important;
  animation: currentLevelPulse 1.8s infinite ease-in-out !important;
  box-shadow: 0 0 14px rgba(255, 215, 0, 0.5), inset 0 0 8px rgba(255, 215, 0, 0.2) !important;
}
@keyframes currentLevelPulse {
  0%, 100% { box-shadow: 0 0 12px rgba(255, 215, 0, 0.4), inset 0 0 6px rgba(255, 215, 0, 0.1); filter: brightness(1); }
  50% { box-shadow: 0 0 22px rgba(255, 215, 0, 0.8), inset 0 0 12px rgba(255, 215, 0, 0.3); filter: brightness(1.15); }
}

/* Màn quiz ôn tập - full width */
.lv-btn.quiz-exam {
  grid-column: span 2;
  flex-direction:row; gap:12px; padding:13px 18px;
  border-width:3px;
  background:rgba(0,0,0,.5);
}
.lv-btn.quiz-exam .lv-num { font-size:1.6rem; }
.lv-btn.quiz-exam .exam-info { text-align:left; flex:1; }
/* Boss */
.lv-btn.boss-lv {
  grid-column: span 2;
  border-color:#FF4500 !important; border-width:3px;
  background:linear-gradient(135deg,rgba(255,69,0,.12),rgba(255,215,0,.08));
}
.lv-btn.boss-lv:not(.current-playing) {
  animation:bossGlow 2s ease-in-out infinite;
}
@keyframes bossGlow {
  0%,100%{box-shadow:0 0 8px rgba(255,69,0,.3);}
  50%{box-shadow:0 0 22px rgba(255,69,0,.7);}
}
.lv-btn.boss-lv .lv-num { color:#FF4500; font-size:1.5rem; }

.lv-num  { font-family:var(--font-head); font-size:1.35rem; letter-spacing:2px; color:var(--c,#00d2ff); position:relative; }
/* Đồng bộ màu chữ số cho ô hiện tại sang vàng Gold nhẹ để ăn nhập tổng thể */
.lv-btn.current-playing .lv-num { color: #FFD700 !important; }

.lv-name { font-size:.7rem; opacity:.72; position:relative; text-align:center; line-height:1.3; }
.lv-sub  { font-size:.6rem; opacity:.38; position:relative; text-align:center; }
.lv-type { font-size:.6rem; opacity:.4; position:relative; }

/* Speed badge for cap3 */
.speed-badge {
  position:absolute; top:5px; right:8px;
  font-family:var(--font-head); font-size:.7rem; letter-spacing:1px;
  color:var(--c,#e91e8c);
  opacity:.7;
}

::-webkit-scrollbar { width:3px; }
::-webkit-scrollbar-thumb { background:rgba(255,215,0,.2); border-radius:2px; }

/* ── GIAO DIỆN HỘP THOẠI NHẬP MẬT MÃ CAO CẤP CHUYÊN BIỆT ── */
.custom-modal-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999; opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
.custom-modal-overlay.active { opacity: 1; pointer-events: auto; }
.custom-modal {
  background: #0f141c; border: 2px solid var(--modal-color, var(--gold));
  border-radius: 16px; padding: 24px; width: 90%; max-width: 340px;
  text-align: center; box-shadow: 0 0 25px var(--modal-color, rgba(255, 215, 0, 0.4));
  transform: scale(0.85); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.custom-modal-overlay.active .custom-modal { transform: scale(1); }
.modal-title {
  font-family: var(--font-head); font-size: 1.2rem; letter-spacing: 2px;
  margin-bottom: 6px; color: var(--modal-color, var(--gold));
  text-shadow: 0 0 8px var(--modal-color, rgba(255, 215, 0, 0.3));
}
.modal-subtitle { font-size: 0.75rem; color: rgba(255, 255, 255, 0.6); margin-bottom: 18px; }
.modal-input {
  width: 100%; padding: 12px; border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.15); background: rgba(0, 0, 0, 0.4);
  color: #fff; font-size: 1.1rem; text-align: center; letter-spacing: 3px;
  margin-bottom: 18px; outline: none; transition: border-color 0.2s;
}
.modal-input:focus { border-color: var(--modal-color, var(--gold)); box-shadow: 0 0 8px var(--modal-color, rgba(255,215,0,0.2)); }
.modal-error { color: #ff3838; font-size: 0.7rem; margin-top: -12px; margin-bottom: 12px; display: none; font-weight: bold; }
.modal-actions { display: flex; gap: 10px; }
.modal-btn {
  flex: 1; padding: 10px; border-radius: 8px; border: none;
  font-family: var(--font-head); font-size: 0.85rem; letter-spacing: 1px;
  cursor: pointer; transition: background 0.2s, transform 0.1s;
}
.modal-btn-cancel { background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.7); border: 1px solid rgba(255,255,255,0.1); }
.modal-btn-cancel:active { transform: scale(0.96); }
.modal-btn-confirm { background: var(--modal-color, var(--gold)); color: #000; font-weight: bold; }
.modal-btn-confirm:active { transform: scale(0.96); }
</style>
</head>
<body>
<div class="bg-layer bg-grid"></div>
<div class="bg-layer bg-glow-center"></div>

<div id="app">
  <div id="global-progress"><div id="global-progress-fill"></div></div>

      </div>

</div>

<div class="custom-modal-overlay" id="pwd-modal-overlay">

  </div>
</div>

<script src="shared.js"></script>
<script>
const TOTAL = 33;

// ── CẤP 1: LV 1-11 ─────────────────────────────────────────
const CAP1 = [
  {n:1,  name:"Ghép Thẻ",        sub:"00–09", type:"card",   href:"lv1.html",  c:"#00d2ff"},
  {n:2,  name:"Bắn Thiên Thạch", sub:"00–09", type:"shoot", href:"lv2.html",  c:"#00d2ff"},
  {n:3,  name:"Ghép Thẻ",        sub:"10–19", type:"card",   href:"lv3.html",  c:"#00d2ff"},
  {n:4,  name:"Bắn Thiên Thạch", sub:"10–19", type:"shoot", href:"lv4.html",  c:"#00d2ff"},
  {n:5,  name:"Ghép Thẻ",        sub:"20–29", type:"card",   href:"lv5.html",  c:"#00d2ff"},
  {n:6,  name:"Phi Tiêu",        sub:"20–29", type:"shoot", href:"lv6.html",  c:"#00d2ff"},
  {n:7,  name:"Ghép Thẻ",        sub:"30–39", type:"card",   href:"lv7.html",  c:"#00d2ff"},
  {n:8,  name:"Bảo Vệ Trái Đất", sub:"30–39", type:"shoot", href:"lv8.html",  c:"#00d2ff"},
  {n:9,  name:"Ghép Thẻ",        sub:"40–49", type:"card",   href:"lv9.html",  c:"#00d2ff"},
  {n:10, name:"Bắn Thiên Thạch", sub:"40–49", type:"shoot", href:"lv10.html", c:"#00d2ff"},
  {n:11, name:"Kiểm Tra Tổng",   sub:"00–50 • 51 câu • 10s", type:"exam", href:"lv11.html", c:"#00d2ff", alwaysOpen:true},
];

// ── CẤP 2: LV 12-22 ────────────────────────────────────────
const CAP2 = [
  {n:12, name:"Ghép Thẻ",        sub:"50–59", type:"card",   href:"lv12.html", c:"#2ecc71"},
  {n:13, name:"Bắn Thiên Thạch", sub:"50–59", type:"shoot", href:"lv13.html", c:"#2ecc71"},
  {n:14, name:"Ghép Thẻ",        sub:"60–69", type:"card",   href:"lv14.html", c:"#2ecc71"},
  {n:15, name:"Bắn Thiên Thạch", sub:"60–69", type:"shoot", href:"lv15.html", c:"#2ecc71"},
  {n:16, name:"Ghép Thẻ",        sub:"70–79", type:"card",   href:"lv16.html", c:"#2ecc71"},
  {n:17, name:"Bắn Thiên Thạch", sub:"70–79", type:"shoot", href:"lv17.html", c:"#2ecc71"},
  {n:18, name:"Ghép Thẻ",        sub:"80–89", type:"card",   href:"lv18.html", c:"#2ecc71"},
  {n:19, name:"Sóng Siêu Âm",    sub:"80–89", type:"shoot", href:"lv19.html", c:"#2ecc71"},
  {n:20, name:"Ghép Thẻ",        sub:"90–99", type:"card",   href:"lv20.html", c:"#2ecc71"},
  {n:21, name:"Bắn Laser",       sub:"90–99", type:"shoot", href:"lv21.html", c:"#2ecc71"},
  {n:22, name:"Kiểm Tra Tổng",   sub:"50–99 • 50 câu • 10s", type:"exam", href:"lv22.html", c:"#2ecc71", alwaysOpen:true},
];

// ── CẤP 3: LV 23-33 ────────────────────────────────────────
const CAP3 = [
  {n:23, name:"Ôn Tổng Hợp",   sub:"00–99", speed:"10s", href:"lv23.html", c:"#e91e8c", alwaysOpen:true},
  {n:24, name:"Siêu Tốc",      sub:"00–99", speed:"7s",  href:"lv24.html", c:"#e91e8c"},
  {n:25, name:"Tốc Độ Cao",    sub:"00–99", speed:"5s",  href:"lv25.html", c:"#e91e8c"},
  {n:26, name:"Phản Xạ",       sub:"00–99", speed:"4.5s",href:"lv26.html", c:"#e91e8c"},
  {n:27, name:"Bắn Nhanh",     sub:"00–99", speed:"4s",  href:"lv27.html", c:"#e91e8c"},
  {n:28, name:"Cảnh Giới",     sub:"00–99", speed:"3.5s",href:"lv28.html", c:"#e91e8c"},
  {n:29, name:"Phá Giới Hạn",  sub:"00–99", speed:"3s",  href:"lv29.html", c:"#e91e8c"},
  {n:30, name:"Thần Tốc",      sub:"00–99", speed:"2.5s",href:"lv30.html", c:"#e91e8c"},
  {n:31, name:"Ánh Sáng",      sub:"00–99", speed:"2s",  href:"lv31.html", c:"#e91e8c"},
  {n:32, name:"Vô Điều Kiện",  sub:"00–99", speed:"1.5s",href:"lv32.html", c:"#e91e8c"},
  {n:33, name:"TRÙM CUỐI",     sub:"00–99", speed:"1s",  href:"lv33.html", c:"#FF4500", boss:true},
];

const TYPE_ICON = { card:'🃏', shoot:'🚀', exam:'📝', quiz:'⚡' };
const TYPE_LABEL = { card:'Ghép thẻ', shoot:'Bắn hạ', exam:'Trắc nghiệm', quiz:'Quiz' };

let targetScrollElement = null;
let maxUnlockedLv = 1;

function makeBtn(lv, grid) {
  const done     = STN.Progress.isDone(lv.n);
  const unlocked = lv.alwaysOpen ? true : STN.Progress.isUnlocked(lv.n);
  const isExam   = lv.type === 'exam';
  const isBoss   = lv.boss;
  const isSpeed  = !!lv.speed;

  const a = document.createElement('a');
  a.id = `btn-lv-${lv.n}`;
  a.href = unlocked ? lv.href : '#';
  let cls = 'lv-btn';
  if (done)     cls += ' done';
  if (!unlocked) cls += ' locked';
  if (isExam)   cls += ' quiz-exam';
  if (isBoss)   cls += ' boss-lv';
  a.className = cls;
  a.style.setProperty('--c', lv.c);

  if (isExam) {
    a.innerHTML = `
      <div class="lv-num">LV ${lv.n}</div>
      <div class="exam-info">
        <div class="lv-name" style="text-align:left;font-size:.78rem;font-weight:700;opacity:1">
          ${unlocked ? '📝 ' + lv.name : '🔒 Chưa mở'}
        </div>
        <div class="lv-sub" style="text-align:left">${lv.sub}</div>
        ${lv.alwaysOpen ? '<div style="font-size:.6rem;color:rgba(255,255,255,.3);margin-top:2px">✅ Luôn mở khóa</div>' : ''}
      </div>`;
  } else if (isBoss) {
    a.innerHTML = `
      <div class="lv-num">LV ${lv.n}</div>
      <div class="exam-info" style="text-align:left;flex:1">
        <div class="lv-name" style="text-align:left;font-weight:700;opacity:1;font-size:.8rem">
          ${unlocked ? '💀 ' + lv.name : '🔒 Chưa mở'}
        </div>
        <div class="lv-sub" style="text-align:left">${lv.sub}</div>
      </div>
      <div style="font-family:var(--font-head);font-size:1.4rem;color:#FF4500;letter-spacing:1px">${lv.speed}</div>`;
  } else if (isSpeed) {
    a.innerHTML = `
      <div class="lv-num">LV ${lv.n}</div>
      <div class="hover-glow"></div>
      <div class="lv-name">${unlocked ? lv.name : 'Chưa mở'}</div>
      <div class="lv-sub">${lv.sub}</div>
      <div class="speed-badge">${lv.speed}</div>`;
  } else {
    const icon = TYPE_ICON[lv.type] || '🎮';
    a.innerHTML = `
      <div class="lv-num">LV ${lv.n}</div>
      <div class="lv-name">${unlocked ? lv.name : 'Chưa mở'}</div>
      <div class="lv-type">${unlocked ? icon+' '+TYPE_LABEL[lv.type] : '🔒 Hoàn thành LV '+(lv.n-1)}</div>
      <div class="lv-sub">${lv.sub}</div>`;
  }

  // Thuật toán tìm level cao nhất đang mở khóa (Chính là Level hiện tại cần chơi)
  if (unlocked && lv.n >= maxUnlockedLv && !lv.alwaysOpen) {
    maxUnlockedLv = lv.n;
    targetScrollElement = a;
  }

  a.addEventListener('click', e => {
    e.preventDefault();
    if (!unlocked) {
      STN.Audio.sfx.wrong();
      a.animate([
        {transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}
      ], {duration:220});
      return;
    }
    STN.Audio.sfx.click();
    setTimeout(() => window.location.href = lv.href, 110);
  });
  grid.appendChild(a);
}

// Render grids
const g1 = document.getElementById('grid-cap1');
CAP1.forEach(lv => makeBtn(lv, g1));

const g2 = document.getElementById('grid-cap2');
CAP2.forEach(lv => makeBtn(lv, g2));

const g3 = document.getElementById('grid-cap3');
CAP3.forEach(lv => makeBtn(lv, g3));

document.getElementById('global-progress-fill').style.width = (done/TOTAL*100) + '%';


// ── LOGIC TỰ ĐỘNG CUỘN VÀ TẶNG KHUNG VÀNG SÁNG CHO LEVEL HIỆN TẠI ──
if (targetScrollElement) {
  // Thêm Class khung vàng chói sáng vào phần tử được định vị
  targetScrollElement.classList.add('current-playing');
  
  setTimeout(() => {
    targetScrollElement.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }, 400);
}


// ── LOGIC XỬ LÝ RIÊNG BIỆT CHO 2 Ô THI ĐẤU SIÊU SÁNG ──
const btnTour3 = document.getElementById('btn-tour-3');
const btnTour5 = document.getElementById('btn-tour-5');

let currentModalContext = null;

function openCustomPrompt(title, themeColor, onConfirm) {
  const overlay = document.getElementById('pwd-modal-overlay');
  const input = document.getElementById('modal-input');
  const txtTitle = document.getElementById('modal-title');
  const errDiv = document.getElementById('modal-error');
  
  txtTitle.innerText = title.toUpperCase();
  overlay.style.setProperty('--modal-color', themeColor);
  errDiv.style.display = 'none';
  input.value = '';
  
  overlay.classList.add('active');
  setTimeout(() => input.focus(), 150);
  
  currentModalContext = { overlay, input, errDiv, onConfirm };
}

function closeCustomPrompt() {
  if (currentModalContext) {
    currentModalContext.overlay.classList.remove('active');
    currentModalContext = null;
  }
}

function submitCustomModal() {
  if (!currentModalContext) return;
  const { input, errDiv, onConfirm } = currentModalContext;
  const code = input.value.trim();
  
  const success = onConfirm(code);
  
  if (success) {
    closeCustomPrompt();
  } else {
    if(STN.Audio.sfx.wrong) STN.Audio.sfx.wrong();
    errDiv.style.display = 'block';
    document.getElementById('pwd-modal').animate([
      {transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}
    ], {duration:220});
    input.select();
  }
}

document.getElementById('modal-btn-confirm').addEventListener('click', submitCustomModal);
document.getElementById('modal-btn-cancel').addEventListener('click', closeCustomPrompt);
document.getElementById('modal-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitCustomModal();
  if (e.key === 'Escape') closeCustomPrompt();
});

function handleTournamentClick(e, correctCode, targetHref, title, themeColor) {
  e.preventDefault();
  const targetBtn = e.currentTarget;

  openCustomPrompt(title, themeColor, (codeInput) => {
    if (codeInput === correctCode) {
      if(STN.Audio.sfx.click) STN.Audio.sfx.click();
      setTimeout(() => window.location.href = targetHref, 110);
      return true; 
    } else {
      targetBtn.animate([
        {transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)'}
      ], {duration:220});
      return false;
    }
  });
}

btnTour3.addEventListener('click', e => handleTournamentClick(e, 'ngochan', 'thidautrinhocap3sao.html', 'Đấu Trí Nhớ 3 Sao', '#ff9f43'));
btnTour5.addEventListener('click', e => handleTournamentClick(e, 'nhatquang', 'thidautrinhocap5sao.html', 'Đấu Trí Nhớ 5 Sao', '#ff3838'));

document.addEventListener('click',   () => STN.Audio.startBg(), {once:true});
document.addEventListener('touchstart', () => STN.Audio.startBg(), {once:true});
</script>
